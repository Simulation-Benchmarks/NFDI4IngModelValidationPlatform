name: Merge docs into notebooks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-fenics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Merge docs into FEniCS notebook
        run: |
          python scripts/merge_docs_to_notebook.py \
            --doc docs/benchmarks/linear-elastic/plate-with-hole.md \
            --notebook notebooks/plate_with_hole_fenics.ipynb \
            --repo "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --new notebooks/plate_with_hole_fenics.ipynb

      - name: Commit merged FEniCS notebook back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- notebooks/plate_with_hole_fenics.ipynb; then
            echo "No changes to the FEniCS notebook."
            exit 0
          fi
          git add notebooks/plate_with_hole_fenics.ipynb
          git commit -m "Auto-merge docs into plate-with-hole FEniCS notebook [skip ci]"
          git push

      - name: Upload FEniCS notebook as artifact
        uses: actions/upload-artifact@v4
        with:
          name: notebook-plate-with-hole-fenics
          path: notebooks/plate_with_hole_fenics.ipynb
          if-no-files-found: error
          retention-days: 14

  merge-kratos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Merge docs into Kratos notebook
        run: |
          python scripts/merge_docs_to_notebook.py \
            --doc docs/benchmarks/linear-elastic/plate-with-hole.md \
            --notebook notebooks/plate_with_hole_Kratos.ipynb \
            --repo "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --new notebooks/plate_with_hole_Kratos.ipynb

      - name: Commit merged Kratos notebook back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- notebooks/plate_with_hole_Kratos.ipynb; then
            echo "No changes to the Kratos notebook."
            exit 0
          fi
          git add notebooks/plate_with_hole_Kratos.ipynb
          git commit -m "Auto-merge docs into plate-with-hole Kratos notebook [skip ci]"
          git push

      - name: Upload Kratos notebook as artifact
        uses: actions/upload-artifact@v4
        with:
          name: notebook-plate-with-hole-kratos
          path: notebooks/plate_with_hole_Kratos.ipynb
          if-no-files-found: error
          retention-days: 14
